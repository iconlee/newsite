<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="myframe8 项目主页" />
  <title>myframe8</title>
  <style>
    :root {
      --ink: #1f2937;
      --muted: #6b7280;
      --accent: #4f46e5;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 20% 0%, #eef2ff, transparent 60%),
        #f8fafc;
      display: grid;
      place-items: center;
      padding: 24px;
      line-height: 1.7;
    }
    main {
      width: min(640px, 100%);
      background: var(--card);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.04em;
      margin: 0 0 18px;
    }
    .brand::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--accent);
    }
    h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.3; }
    p { margin: 0 0 8px; }
    .lead { color: var(--muted); }
    footer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid #f1f5f9;
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 480px) {
      main { padding: 28px 22px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">myframe8</p>
    <h1>项目主页</h1>
    <p class="lead">这是 myframe8 的首页初始版本。后续将在这里汇总项目说明与相关工具入口。</p>
    <footer>myframe8 · 2026</footer>
  </main>
</body>
</html>
